[tool.poetry]
name = "content-lab-qa"
version = "0.1.0"
description = "Quality assurance gates and content validation"
authors = ["Ryan <you@example.com>"]
packages = [{ include = "content_lab_qa", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
content-lab-shared = {path = "../shared/py", develop = true}
content-lab-core = {path = "../core", develop = true}
content-lab-creative = {path = "../creative", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
mypy = "^1.10.0"
ruff = "^0.4.10"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = [
    "content_lab_qa",
    "content_lab_core",
    "content_lab_creative",
    "content_lab_shared",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = [
  "semantic_reel_regression: fast semantic gate regressions (bad-but-valid reel class + JSON fixtures).",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
